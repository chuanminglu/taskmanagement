spring:
  profiles:
    active: dev   # 生产环境改为 prod

  datasource:
    url: jdbc:mysql://localhost:3306/taskmanagement?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-in-production-min-256-bits}
    access-token-expiry: 1800000     # 30 分钟
    refresh-token-expiry: 604800000  # 7 天

server:
  port: 8080
