# 开发环境：使用 H2 内存数据库（MySQL 兼容模式）
# 生产环境使用 application-prod.yml 中的 MySQL 配置
spring:
  datasource:
    url: jdbc:h2:mem:taskmanagement;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
